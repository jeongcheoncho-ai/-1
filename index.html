  const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const info = () => `<div class="notice">🔒 수집 정보: 학년·반·번호·이름, 답안, 제출 시각 · 이용 목적: 교육활동 참여 확인 및 결과 집계 · 열람: 승인된 담당 교사 · 보관: ${esc(cfg.PRIVACY_RETENTION || '학교 안내에 따름')} · 문의: ${esc(cfg.PRIVACY_CONTACT || '학교 담당 선생님')}. <strong>학교의 개인정보 안내를 받은 경우에만 참여하세요.</strong></div>`;
  const demo = () => !online ? `<div class="notice warning"><strong>⚠ 미리보기 모드:</strong> 서버가 연결되지 않았습니다. 연습용 가상 이름을 사용하세요. 퀴즈는 실행되지만 답안은 어디에도 저장되지 않습니다.</div>` : '';
  const frame = (content, caption='5분이면 충분해요!') => `<section class="hero"><span class="eyebrow">🌈 THE DIGITAL CITIZEN QUEST</span><h1>디지털 세상을 지키는<br><em>멋진 시민이 되자!</em></h1><p>${caption}</p><div class="overview-pills"><span>⭕❌ OX 5문제</span><span>✍️ 단답형 5문제</span><span>🎮 미니게임 1개</span></div></section>${content}`;
  function intro(){return frame(`<section class="card intro-card"><div class="intro-top-art" aria-hidden="true">🧑‍🚀🌏✨</div><h2 class="card-title">탐험가 등록하기</h2><p class="card-subtitle">학교에서 안내받은 학생만 참여해 주세요. 입력 후 11개의 미션이 시작돼요.</p>${demo()}<form id="studentEntry"><div class="fields"><div class="field"><label for="grade">학년</label><select id="grade" name="grade" class="select-input" required>${[3,4,5,6].map(n=>`<option value="${n}">${n}학년</option>`).join('')}</select></div><div class="field"><label for="classNo">반</label><input id="classNo" name="classNo" class="text-input" inputmode="numeric" type="number" min="1" max="20" placeholder="예: 2" required></div><div class="field"><label for="studentNo">번호</label><input id="studentNo" name="studentNo" class="text-input" inputmode="numeric" type="number" min="1" max="60" placeholder="예: 12" required></div><div class="field full"><label for="studentName">체험용 별명 (실명 금지)</label><input id="studentName" name="studentName" class="text-input" maxlength="12" placeholder="예: 별빛탐험가" autocomplete="off" required></div></div>${info()}<button class="button primary full" type="submit">✨ 탐험 시작하기 →</button></form></section>`, 'OX 퀴즈부터 미니게임까지, 11개의 작은 도전!')}
  function progress(index){return `<div class="quiz-progress-head"><span class="progress-name">🧭 ${esc(state.identity?.grade)}학년 ${esc(state.identity?.class_no)}반 · ${esc(state.identity?.student_name)} 탐험가</span><span class="progress-count">${index} / ${questions.length} 미션</span></div><div class="progress-track" role="progressbar" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${questions.length}" aria-label="진행률"><div class="progress-fill" style="width:${(index/questions.length)*100}%"></div></div>`;}
  function question(){
    const q=questions[state.index], value=state.answers[q.id]||'';
    let answers='';
    if(q.type==='ox') answers=`<div class="answer-row" role="group" aria-label="OX 정답 선택"><button type="button" data-answer="O" class="answer-choice ${value==='O'?'chosen':''}" aria-pressed="${value==='O'}">O</button><button type="button" data-answer="X" class="answer-choice no ${value==='X'?'chosen':''}" aria-pressed="${value==='X'}">X</button></div><p class="hint">💡 문장을 읽고 맞으면 O, 틀리면 X를 선택해요.</p>`;
    if(q.type==='short') answers=`<label for="shortAnswer">나의 답</label><input id="shortAnswer" class="text-input question-input" maxlength="40" autocomplete="off" placeholder="${esc(q.placeholder||'정답을 입력하세요')}" value="${esc(value)}"><p class="hint">💡 힌트: ${esc(q.hint)}</p>`;
    if(q.type==='game') answers=`<div class="game-intro">🗝️ 안전한 길을 골라 디지털 마을을 구해주세요!</div><div class="door-grid" role="group" aria-label="미니게임 선택">${q.options.map(o=>`<button type="button" class="door ${value===o.value?'chosen':''}" aria-pressed="${value===o.value}" data-answer="${esc(o.value)}"><span class="door-icon" aria-hidden="true">${o.icon}</span><span class="door-title">${esc(o.title)}</span><span class="door-detail">${esc(o.detail)}</span></button>`).join('')}</div>`;
    const label=q.type==='ox'?'⭕❌ OX 미션':q.type==='short'?'✍️ 단답 미션':'🎮 마지막 미니게임';
    return `<div class="quiz-layout">${progress(state.index)}<section class="card question-card"><span class="topic-tag">${label} · ${esc(q.topic)}</span><div class="question-number">QUESTION ${String(state.index+1).padStart(2,'0')}</div><h2 class="question-text">${esc(q.prompt)}</h2>${answers}</section><div class="quiz-actions"><button class="button ghost" type="button" data-action="back">← 이전</button><button class="button primary" type="button" data-action="next" ${!String(value).trim()?'disabled':''}>${state.index===questions.length-1?'결과 확인 →':'다음 문제 →'}</button></div></div>`;
  }
  function review(){const count=questions.filter(q=>String(state.answers[q.id]??'').trim()).length;return `<div class="quiz-layout">${progress(questions.length)}<section class="card"><div class="finish-hero"><div class="finish-emoji">🎯</div><h2 class="card-title">모든 미션 완료!</h2><p class="card-subtitle">답안을 제출하기 전에 마지막으로 확인해 주세요.</p></div><div class="checklist"><div class="check-item"><b>탐험가</b><span>${esc(state.identity.grade)}학년 ${esc(state.identity.class_no)}반 ${esc(state.identity.student_no)}번 ${esc(state.identity.student_name)}</span></div><div class="check-item"><b>답변한 문제</b><span>${count} / ${questions.length}문제</span></div><div class="check-item"><b>저장 방식</b><span>${online?'학교 결과 저장소':'미리보기(미저장)'}</span></div></div>${demo()}${state.error?`<div class="error" role="alert">${esc(state.error)}</div>`:''}<p class="small">같은 학년·반·번호로는 한 번만 제출할 수 있어요. 입력 내용이 정확한지 확인해 주세요.</p><div class="quiz-actions"><button class="button ghost" type="button" data-action="back">← 수정하기</button><button class="button primary" type="button" data-action="submit" ${state.sending?'disabled':''}>${state.sending?'제출 중…':'🎉 최종 제출'}</button></div></section></div>`;}
  function finish(){const result=questions.map((q,i)=>({q,i,correct:window.quizIsCorrect(q,state.answers[q.id])}));return `<div class="quiz-layout"><section class="card finish-hero"><div class="finish-emoji" aria-hidden="true">🏆🎊</div><h2 class="card-title">디지털 시민 미션 성공!</h2><p class="card-subtitle">${esc(state.identity.student_name)} 탐험가, 끝까지 도전했어요!</p><div class="score-number">${state.score}<small> / ${questions.length}점</small></div><div class="badge-line">${state.score===questions.length?'🌟 완벽한 디지털 시민!':'🌱 오늘 배운 내용을 일상에서 실천해요!'}</div>${online?'<div class="success" style="margin-top:20px">✅ 답안이 정상적으로 저장되었습니다.</div>':'<div class="notice warning" style="margin-top:20px">⚠ 미리보기: 답안이 저장되지 않았습니다.</div>'}<div class="feedback-list">${result.map(r=>`<div class="feedback-item ${r.correct?'right':'wrong'}"><b>${r.correct?'✅':'💡'} ${r.i+1}번 · ${esc(r.q.topic)} ${r.correct?'정답':'함께 알아보기'}</b>${r.correct?esc(r.q.explain):`정답: <strong>${esc(r.q.correct)}</strong> · ${esc(r.q.explain)}`}</div>`).join('')}</div><div style="margin-top:25px"><p class="small">멋진 디지털 시민의 약속: 공유하기 전 확인하고, 말하기 전 배려하기!</p><button class="button secondary" type="button" data-action="reset">처음 화면으로</button></div></section></div>`;}
  function render(){app.innerHTML=state.page==='intro'?intro():state.page==='quiz'?question():state.page==='review'?review():finish();}
  app.addEventListener('submit',event=>{if(event.target.id!=='studentEntry')return;event.preventDefault();const f=new FormData(event.target);const grade=Number(f.get('grade')),class_no=Number(f.get('classNo')),student_no=Number(f.get('studentNo')),student_name=String(f.get('studentName')||'').trim();if(![3,4,5,6].includes(grade)||!Number.isInteger(class_no)||class_no<1||class_no>20||!Number.isInteger(student_no)||student_no<1||student_no>60||!student_name||student_name.length>12){alert('학년·반·번호·이름을 확인해 주세요.');return;}state.identity={grade,class_no,student_no,student_name};state.index=0;state.page='quiz';render();window.scrollTo(0,0);});
  app.addEventListener('input',event=>{if(event.target.id!=='shortAnswer')return;const q=questions[state.index];state.answers[q.id]=event.target.value;const next=app.querySelector('[data-action="next"]');if(next)next.disabled=!event.target.value.trim();});
  app.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-answer')){const answer=button.dataset.answer;state.answers[questions[state.index].id]=answer;render();return;}
    const action=button.dataset.action;
    if(action==='back'){if(state.page==='review'){state.page='quiz';state.index=questions.length-1;}else if(state.index===0){state.page='intro';state.answers={};state.identity=null;}else state.index--;render();}
    if(action==='next'){const q=questions[state.index];if(!String(state.answers[q.id]??'').trim())return;if(state.index===questions.length-1){state.page='review';state.index=questions.length;}else state.index++;render();}
    if(action==='reset'){state.page='intro';state.index=0;state.identity=null;state.answers={};state.error='';state.score=0;render();}
    if(action==='submit'&&!state.sending){state.error='';const unanswered=questions.find(q=>!String(state.answers[q.id]??'').trim());if(unanswered){state.error='모든 문제에 답해 주세요.';render();return;}state.sending=true;render();if(online){try{const payload={...state.identity,answers:Object.fromEntries(questions.map(q=>[q.id,String(state.answers[q.id]).trim()]))};const {error}=await db.from('submissions').insert(payload);if(error)throw error;}catch(e){state.sending=false;state.error=e?.code==='23505'?'이미 제출된 학년·반·번호입니다. 잘못 입력했다면 담당 선생님께 말씀해 주세요.':'제출에 실패했습니다. 인터넷 연결이나 학교 시스템 설정을 확인하고 다시 시도해 주세요.';render();return;}}state.sending=false;state.score=questions.reduce((total,q)=>total+(window.quizIsCorrect(q,state.answers[q.id])?1:0),0);state.page='done';render();window.scrollTo(0,0);}
  });
  render();
})();

</script>
</body>
</html>
